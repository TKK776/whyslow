name: screenshots

# The README hero image is the asset the launch depends on, so it is generated
# rather than hand-made. This keeps it in sync with the actual UI forever.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/screenshot.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run shots

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "chore: regenerate screenshots [skip ci]"
            git push
          fi
